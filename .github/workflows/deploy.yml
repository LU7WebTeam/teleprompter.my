name: Deploy to Replit

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH into Replit and rebuild
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REPLIT_SSH_HOST }}
          username: ${{ secrets.REPLIT_SSH_USERNAME }}
          key: ${{ secrets.REPLIT_SSH_PRIVATE_KEY }}
          script: |
            cd ~/workspace/artifacts/teleprompter
            git pull origin main
            npm run build
