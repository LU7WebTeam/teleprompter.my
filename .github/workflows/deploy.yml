name: Deploy to Replit

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Replit rebuild
        env:
          WEBHOOK_SECRET: ${{ secrets.REPLIT_WEBHOOK_SECRET }}
        run: |
          curl -f -X POST \
            -H "Authorization: Bearer ${WEBHOOK_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{"site":"teleprompter"}' \
            https://myeventqr.com/api/webhook/rebuild
